<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accedi — Music Method Store</title>
  <link rel="stylesheet" href="/styles.css?v={{buildVersion}}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo" aria-label="Music Method Store - Home">
        <span class="logo-icon">🎵</span>
        <span class="logo-text">Music Method Store</span>
      </a>
    </div>
  </header>

  <main class="container auth-main">
    <div class="auth-card">
      <h1>Accedi</h1>
      <p class="auth-subtitle">Inserisci le tue credenziali per ricevere il codice 2FA via email.</p>

      <div id="login-error" class="alert alert-error" hidden></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="tua@email.it">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </div>

        <p class="form-hint">
          <a href="/forgot-password">Password dimenticata?</a>
        </p>

        <button type="submit" class="btn btn-primary btn-block">Invia codice 2FA</button>
      </form>

      <p class="auth-footer">
        Non hai un account? <a href="/registrati">Registrati</a>
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Music Method Store</p>
    </div>
  </footer>

  <script nonce="{{cspNonce}}" type="module" src="/js/main.js?v={{buildVersion}}"></script>
  <script nonce="{{cspNonce}}" type="module">
    import { handleLogin } from '/js/auth.js';
    document.getElementById('login-form').addEventListener('submit', handleLogin);
  </script>
</body>
</html>
