<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imposta nuova password — Music Method Store</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/catalogo" class="logo" aria-label="Music Method Store - Home">
        <span class="logo-icon">🎵</span>
        <span class="logo-text">Music Method Store</span>
      </a>
    </div>
  </header>

  <main class="container auth-main">
    <div class="auth-card">
      <h1>Imposta nuova password</h1>
      <p class="auth-subtitle">Scegli una nuova password per il tuo account.</p>

      <div id="reset-error" class="alert alert-error" hidden></div>
      <div id="reset-success" class="alert alert-success" hidden></div>

      <form id="reset-form" novalidate>
        <div class="form-group">
          <label for="password">Nuova password</label>
          <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="Minimo 8 caratteri" minlength="8">
        </div>

        <div class="form-group">
          <label for="password2">Conferma nuova password</label>
          <input type="password" id="password2" name="password2" required autocomplete="new-password" placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary btn-block">Aggiorna password</button>
      </form>

      <p class="auth-footer">
        <a href="/login">Torna al login</a>
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Music Method Store</p>
    </div>
  </footer>

  <script nonce="{{cspNonce}}" type="module" src="/js/main.js"></script>
  <script nonce="{{cspNonce}}" type="module">
    import { handleResetPassword } from '/js/auth.js';
    document.getElementById('reset-form').addEventListener('submit', handleResetPassword);
  </script>
</body>
</html>
