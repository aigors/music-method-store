<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recupera password — Music Method Store</title>
  <link rel="stylesheet" href="/styles.css?v={{buildVersion}}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo" aria-label="Music Method Store - Home">
        <span class="logo-icon">🎵</span>
        <span class="logo-text">Music Method Store</span>
      </a>
    </div>
  </header>

  <main class="container auth-main">
    <div class="auth-card">
      <h1>Recupera password</h1>
      <p class="auth-subtitle">Inserisci la tua email e ti invieremo un link per reimpostare la password.</p>

      <div id="forgot-error" class="alert alert-error" hidden></div>
      <div id="forgot-success" class="alert alert-success" hidden></div>

      <form id="forgot-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="tua@email.it">
        </div>

        <button type="submit" class="btn btn-primary btn-block">Invia link di recupero</button>
      </form>

      <p class="auth-footer">
        <a href="/login">Torna al login</a>
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Music Method Store</p>
    </div>
  </footer>

  <script nonce="{{cspNonce}}" type="module" src="/js/main.js?v={{buildVersion}}"></script>
  <script nonce="{{cspNonce}}" type="module">
    import { handleForgotPassword } from '/js/auth.js';
    document.getElementById('forgot-form').addEventListener('submit', handleForgotPassword);
  </script>
</body>
</html>
