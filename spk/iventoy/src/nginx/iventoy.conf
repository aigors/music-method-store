# iVentoy nginx reverse proxy configuration
# This is a template - actual config generated by service-setup.sh

server {
    listen 127.0.0.1:26001;
    server_name localhost;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Auth placeholder - replaced by generate_nginx_config()
    # auth_basic "iVentoy Web UI";
    # auth_basic_user_file /var/packages/iventoy/var/htpasswd;

    location / {
        proxy_pass http://127.0.0.1:26000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}