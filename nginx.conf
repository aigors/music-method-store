# Nginx configuration for Music Method Store
# Copia in /etc/nginx/sites-available/musicstore
# ln -s /etc/nginx/sites-available/musicstore /etc/nginx/sites-enabled/
# nginx -t && systemctl reload nginx

upstream musicstore_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name shop.tuodominio.it;

    # Redirect HTTP -> HTTPS (eccetto ACME challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shop.tuodominio.it;

    # === SSL ===
    ssl_certificate /etc/letsencrypt/live/tuodominio.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tuodominio.it/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # === Security Headers ===
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP (adatta se usi CDN esterni)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self';" always;

    # === Root per file statici ===
    root /var/www/musicstore/public;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml image/svg+xml;

    # === Static files (cache lungo) ===
    location ~* \.(css|js|mjs|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # === Favicon / robots ===
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # === Rate limiting per endpoint sensibili ===
    location /api/auth/login {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://musicstore_backend;
        include proxy_params;
    }

    location /api/auth/register {
        limit_req zone=auth burst=2 nodelay;
        proxy_pass http://musicstore_backend;
        include proxy_params;
    }

    location /api/auth/2fa {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://musicstore_backend;
        include proxy_params;
    }

    location /api/admin/books {
        # Upload PDF - limite più basso
        limit_req zone=upload burst=1 nodelay;
        proxy_pass http://musicstore_backend;
        include proxy_params;
        client_max_body_size 60M;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # === API generiche ===
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://musicstore_backend;
        include proxy_params;
    }

    # === Tutte le altre richieste → Node (SPA fallback) ===
    location / {
        proxy_pass http://musicstore_backend;
        include proxy_params;

        # WebSocket support (se servisse in futuro)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # === Proxy params include ===
    # Metti questo in /etc/nginx/proxy_params o includi inline:
    # proxy_set_header Host $host;
    # proxy_set_header X-Real-IP $remote_addr;
    # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # proxy_set_header X-Forwarded-Proto $scheme;
    # proxy_cache_bypass $http_upgrade;
    # proxy_read_timeout 60s;
    # proxy_send_timeout 60s;
}

